  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;ig-shell&quot;&gt;
    &lt;header class=&quot;ig-header&quot;&gt;
      &lt;p class=&quot;ig-eyebrow&quot;&gt;Documento de gobierno · versión adversarial 2&lt;/p&gt;
      &lt;h1&gt;Dominio clínico determinista de inmunología: ruta de constitución, validación y cierre&lt;/h1&gt;
      &lt;p class=&quot;ig-lead&quot;&gt;El dominio no nace de IMMUNO-1 ni de IMMUNO-2. Ambas son semillas de contraste. La constitución clínica se inicia en la pregunta médica y en la disponibilidad real de datos; sólo después se derivan variables, vectores, módulos, composición y lenguaje.&lt;/p&gt;

      &lt;div class=&quot;ig-status-line&quot; aria-label=&quot;Estado rector&quot;&gt;
        &lt;div class=&quot;ig-status ig-stop&quot;&gt;&lt;strong&gt;R2 cerrada&lt;/strong&gt;&lt;span&gt;No se abre antes del cierre clínico, lógico y de datos autorizado.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ig-status ig-data&quot;&gt;&lt;strong&gt;Datos antes que teoría&lt;/strong&gt;&lt;span&gt;Sin repositorio/cohorte adecuada no nace una afirmación biomédica.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ig-status ig-seed&quot;&gt;&lt;strong&gt;Semillas no exhaustivas&lt;/strong&gt;&lt;span&gt;IMMUNO-1 e IMMUNO-2 prueban arquitectura; no fijan el dominio.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ig-status&quot;&gt;&lt;strong&gt;IA subordinada&lt;/strong&gt;&lt;span&gt;Auxilia; no constituye el conocimiento ni adopta la decisión clínica.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;div class=&quot;ig-toolbar&quot;&gt;
      &lt;nav class=&quot;ig-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Secciones del documento&quot;&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-flow&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-flow&quot; aria-selected=&quot;true&quot;&gt;Mapa rector&lt;/button&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-clinical&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-clinical&quot; aria-selected=&quot;false&quot;&gt;Adversarial clínica&lt;/button&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-process&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-process&quot; aria-selected=&quot;false&quot;&gt;Ingeniería de procesos&lt;/button&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-logic&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-logic&quot; aria-selected=&quot;false&quot;&gt;Lógica enlazada&lt;/button&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-boundary&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-boundary&quot; aria-selected=&quot;false&quot;&gt;Datos y frontera&lt;/button&gt;
        &lt;button class=&quot;ig-tab&quot; id=&quot;ig-tab-review&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;ig-panel-review&quot; aria-selected=&quot;false&quot;&gt;Revisor duro&lt;/button&gt;
      &lt;/nav&gt;
      &lt;div&gt;
        &lt;button class=&quot;ig-action&quot; id=&quot;ig-review-mode&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Resaltar bloqueos&lt;/button&gt;
        &lt;button class=&quot;ig-action&quot; id=&quot;ig-print&quot; type=&quot;button&quot;&gt;Imprimir&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;main&gt;
      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-flow&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-flow&quot;&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Camino único gobernado&lt;/h2&gt;
          &lt;p&gt;Las intersecciones obligan a que la clínica determine el contenido y la ingeniería garantice su reproducción sin invadir el juicio médico.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-legend&quot; aria-label=&quot;Leyenda&quot;&gt;
          &lt;span class=&quot;ig-key ig-key-clinical&quot;&gt;Decisión clínica&lt;/span&gt;
          &lt;span class=&quot;ig-key&quot;&gt;Control de proceso&lt;/span&gt;
          &lt;span class=&quot;ig-key ig-key-intersection&quot;&gt;Intersección obligatoria&lt;/span&gt;
          &lt;span class=&quot;ig-key ig-key-stop&quot;&gt;Parada&lt;/span&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-flow&quot; aria-label=&quot;Diagrama de flujo principal&quot;&gt;
          &lt;div class=&quot;ig-gate ig-hard-stop&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Orden 0 · autorización y perímetro&lt;/strong&gt;
            &lt;p&gt;No se infiere ni se modifica nada sin autorización. Fundamentos y Origen de U son invariantes. El álgebra intermodular sólo se reabre por ampliación conceptual expresa o error demostrado.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;0A · Lectura triple de continuidad&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Primera: contexto completo y núcleo de Español-Lenguaje-Inmuno e Inmuno VI.&lt;/li&gt;
                &lt;li&gt;Segunda: precisión, problemas, desvíos, laterales, versiones y contradicciones.&lt;/li&gt;
                &lt;li&gt;Tercera: compilación cruzada de ambos chats, sin armonizar huecos por inferencia.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;0B · Estatuto separado de cada fuente&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Doctrina: Fundamentos y Origen de U.&lt;/li&gt;
                &lt;li&gt;Implementación: ITI V.1 y JavaScript de inmuno/inmuno2.&lt;/li&gt;
                &lt;li&gt;Justificación: publicaciones externas ya producidas.&lt;/li&gt;
                &lt;li&gt;Validez biomédica: fuentes clínicas y datos reales por seleccionar.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-gate&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Puerta de fuente · conflicto, silencio o cambio de versión&lt;/strong&gt;
            &lt;p&gt;No se resuelve lateralmente. Se localiza la afirmación, se conserva su procedencia y se eleva el contraste adversarial para decisión expresa.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node ig-clinical&quot;&gt;
              &lt;h3&gt;1A · Pregunta clínica e intención de uso&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Población, escenario asistencial y usuario profesional.&lt;/li&gt;
                &lt;li&gt;Decisión concreta que se pretende asistir.&lt;/li&gt;
                &lt;li&gt;Consecuencia para paciente y experto si se omite cada conocimiento.&lt;/li&gt;
                &lt;li&gt;Separación entre gravedad posible, probabilidad y acción clínica.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;1B · Disciplina de fuente y vocabulario&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Base formal: sólo Fundamentos y Origen de U.&lt;/li&gt;
                &lt;li&gt;Base biomédica: exclusivamente literatura, normas y datos clínicos pertinentes.&lt;/li&gt;
                &lt;li&gt;En el manuscrito: vector, array o matriz; “célula” sólo como aclaración interna entre paréntesis.&lt;/li&gt;
                &lt;li&gt;El nombre SV no sostiene por sí mismo ninguna afirmación clínica.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-intersection&quot;&gt;
            &lt;span class=&quot;ig-cap&quot; aria-hidden=&quot;true&quot;&gt;∩&lt;/span&gt;
            &lt;div&gt;&lt;strong&gt;Intersección 1 · necesidad clínica ∩ lenguaje científico autocontenido&lt;/strong&gt;&lt;span&gt;Si un revisor no puede entender la finalidad, la unidad de análisis y la consecuencia sin conocer el ecosistema previo, el manuscrito aún no existe como publicación biomédica autónoma.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node ig-clinical&quot;&gt;
              &lt;h3&gt;2A · Búsqueda de repositorios y cohortes&lt;/h3&gt;
              &lt;p&gt;Inventariar datos reales antes de congelar parámetros: diccionario, población, longitudinalidad, desenlaces, licencia, trazabilidad, calidad, pérdidas y posibilidad de validación externa.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;2B · Prueba de factibilidad&lt;/h3&gt;
              &lt;p&gt;Comprobar que las variables y desenlaces necesarios existen, son accesibles y permiten medir criterios clínicos reconocibles. Registrar ausencias; no rellenarlas por inferencia.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-gate ig-hard-stop&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Puerta D0 · ¿hay datos reales adecuados para la pregunta?&lt;/strong&gt;
            &lt;p&gt;NO → se detiene la constitución clínica: queda una hipótesis formal, no un resultado biomédico. SÍ → se fija una instantánea versionada del conjunto de datos y se continúa.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node ig-clinical&quot;&gt;
              &lt;h3&gt;3A · Corpus clínico de autoridad&lt;/h3&gt;
              &lt;p&gt;Guías, consensos, criterios profesionales, evidencia primaria y consecuencias documentadas. El currículo prueba exigencia formativa; no demuestra por sí solo el daño causal de ignorarla.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;3B · Matriz clínica de datos&lt;/h3&gt;
              &lt;p&gt;&lt;strong&gt;X = (a&lt;sub&gt;ij&lt;/sub&gt;)&lt;/strong&gt;: fila &lt;em&gt;i&lt;/em&gt; = paciente/episodio; columna &lt;em&gt;j&lt;/em&gt; = variable clínica. Se preservan el dato singular, su fuente, tiempo explícito, calidad y ausencia.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-intersection&quot;&gt;
            &lt;span class=&quot;ig-cap&quot; aria-hidden=&quot;true&quot;&gt;∩&lt;/span&gt;
            &lt;div&gt;&lt;strong&gt;Intersección 2 · criterio clínico ∩ campo observable ∩ consecuencia ∩ desenlace medible&lt;/strong&gt;&lt;span&gt;Sólo entra un candidato a parámetro si puede justificarse clínicamente, localizarse o derivarse legítimamente en datos y vincularse a una operación verificable.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node ig-seed-node&quot;&gt;
              &lt;h3&gt;4A · Semillas de contraste, no dominio&lt;/h3&gt;
              &lt;p&gt;IMMUNO-1 e IMMUNO-2 —representaciones (25,5) fijadas en ITI V.1— se usan para probar trazabilidad, paso dirigido de parámetros y suficiencia local. La representación auxiliar de IA (9,3) tampoco constituye el dominio. Ninguna de las tres lo agota, dimensiona o decide.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;4B · Inventario exhaustivo dentro del alcance&lt;/h3&gt;
              &lt;p&gt;CSV versionado: concepto, variable, fuente clínica, dato disponible, regla de admisibilidad, transducción, residual, criticidad contextual, consecuencia, módulo y prueba.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-gate&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Puerta D1 · la palabra “todos” exige alcance auditable&lt;/strong&gt;
            &lt;p&gt;Se fijan población, escenarios, fecha de corte, operaciones clínicas, corpus y reglas de inclusión. El dominio amplio se constituye por módulos acotados; no por una matriz plana que pretenda agotar toda la inmunología.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;5A · Transducción y U&lt;/h3&gt;
              &lt;p&gt;El nulo o ausente de la fuente no es U por identidad. Tras admisibilidad, una insuficiencia puede transducirse a U con contexto, mecanismo y trazabilidad. U sólo se resuelve por experto, acontecimiento relevante o medición suficiente.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;5B · Derivación de la arquitectura&lt;/h3&gt;
              &lt;p&gt;El inventario clínico determina longitudes de vectores, módulos, puentes y orden. La composición es dirigida y tipada; cambiar el orden puede cambiar la consecuencia advertida.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-intersection&quot;&gt;
            &lt;span class=&quot;ig-cap&quot; aria-hidden=&quot;true&quot;&gt;∩&lt;/span&gt;
            &lt;div&gt;&lt;strong&gt;Intersección 3 · dato admitido ∩ regla clínica ∩ vector ternario ∩ composición dirigida&lt;/strong&gt;&lt;span&gt;El estado determinista se refiere a una instantánea admitida y a una versión de reglas. No convierte en determinista la biología ni el desenlace futuro del paciente.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;6A · Núcleo determinista aislado&lt;/h3&gt;
              &lt;p&gt;Sin reloj implícito, azar, aprendizaje autónomo ni probabilidad soberana. El tiempo externo entra como dato explícito; la estadística externa entra tipada, con procedencia y alcance.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node ig-clinical&quot;&gt;
              &lt;h3&gt;6B · Evaluación biomédica externa&lt;/h3&gt;
              &lt;p&gt;Concordancia, omisiones críticas, falsos cierres, U apropiada, subgrupos, casos singulares y desenlaces se miden con métodos clínicos/estadísticos fuera del núcleo, conservando cada observación.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-gate ig-hard-stop&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Puerta D2 · validación con datos separados de construcción&lt;/strong&gt;
            &lt;p&gt;Sin validación externa, temporal o multicéntrica adecuada al uso declarado no hay generalización clínica. La validación retrospectiva tampoco autoriza por sí sola el uso asistencial.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;

          &lt;div class=&quot;ig-flow-row&quot;&gt;
            &lt;article class=&quot;ig-node ig-clinical&quot;&gt;
              &lt;h3&gt;7A · Experto y GUI&lt;/h3&gt;
              &lt;p&gt;Frames, parámetros, justificación, U, residual y consecuencias visibles. El inmunólogo revisa y decide; la IA sólo ayuda con conocimiento recibido o actualizado mediante protocolo autorizado.&lt;/p&gt;
            &lt;/article&gt;
            &lt;article class=&quot;ig-node&quot;&gt;
              &lt;h3&gt;7B · Trazabilidad material&lt;/h3&gt;
              &lt;p&gt;Eventos append-only, versiones, origen de datos, regla aplicada, intervención experta, reapertura y resultado. Una corrección añade un suceso; no borra el anterior.&lt;/p&gt;
            &lt;/article&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-gate ig-hard-stop&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;strong&gt;Puerta final · revisión por pares hostil y decisión humana sobre R2&lt;/strong&gt;
            &lt;p&gt;El trabajo debe ser autocontenido, reproducible y capaz de responder cada objeción clínica, matemática, de datos y de proceso. Sólo después, y con autorización expresa, puede plantearse el paso del Lenguaje a R2.&lt;/p&gt;
          &lt;/div&gt;

          &lt;div class=&quot;ig-arrow&quot; aria-hidden=&quot;true&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;ig-return&quot; data-hard-stop=&quot;true&quot;&gt;Cualquier omisión, inferencia, contaminación o contradicción → parar → localizar el origen → adversarial → autorización → reabrir exactamente la etapa causal.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-clinical&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-clinical&quot; hidden&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Adversarial sanitaria, clínica y médica&lt;/h2&gt;
          &lt;p&gt;Evalúa seguridad del paciente, validez clínica y legitimidad de la evidencia. No decide arquitectura informática.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-verdict&quot; data-hard-stop=&quot;true&quot;&gt;
          &lt;strong&gt;Veredicto: el flujo anterior era clínicamente insuficiente porque permitía teoría antes de datos.&lt;/strong&gt;
          &lt;p&gt;La corrección necesaria es estructural: pregunta clínica y factibilidad de repositorios preceden a la congelación de parámetros. IMMUNO-1 e IMMUNO-2 quedan degradadas correctamente a semillas experimentales.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-table-wrap&quot;&gt;
          &lt;table aria-label=&quot;Hallazgos adversariales clínicos&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Nivel&lt;/th&gt;&lt;th&gt;Ataque del revisor&lt;/th&gt;&lt;th&gt;Riesgo clínico&lt;/th&gt;&lt;th&gt;Condición de cierre&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;“Han diseñado el modelo y después buscan datos que encajen.”&lt;/td&gt;&lt;td&gt;Sesgo de confirmación y parámetros sin observabilidad real.&lt;/td&gt;&lt;td&gt;Inventario de repositorios y factibilidad antes de cerrar el dominio.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;“Dos prototipos se presentan como inmunología completa.”&lt;/td&gt;&lt;td&gt;Falsa cobertura y silencios peligrosos ante conocimiento ausente.&lt;/td&gt;&lt;td&gt;Declarar IMMUNO-1/2 como semillas y derivar el dominio desde evidencia clínica y datos.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;“Determinista” se interpreta como desenlace biológico cierto.&lt;/td&gt;&lt;td&gt;Falsa seguridad, consejo excesivo o negación de incertidumbre clínica.&lt;/td&gt;&lt;td&gt;Limitar determinismo a entrada admitida + regla versionada + salida reproducible.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;No existe desenlace ni comparador clínico medible.&lt;/td&gt;&lt;td&gt;No puede demostrarse aumento de criterios ni utilidad.&lt;/td&gt;&lt;td&gt;Preespecificar unidad de análisis, desenlaces, estándar de referencia y comparador.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Criticidad ITI, gravedad, frecuencia y acción se mezclan.&lt;/td&gt;&lt;td&gt;Alertas sobredimensionadas o falsa minimización de daños raros.&lt;/td&gt;&lt;td&gt;Columnas separadas para criticidad formal, gravedad, probabilidad y conducta.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;El dato ausente se convierte automáticamente en U.&lt;/td&gt;&lt;td&gt;Se borra la diferencia entre no capturado, inválido, inadmisible e indeterminado.&lt;/td&gt;&lt;td&gt;Estados previos de datos separados y transducción explícita a U sólo cuando proceda.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Currículos o autoridad profesional se usan como prueba de consecuencia.&lt;/td&gt;&lt;td&gt;La obligación formativa no demuestra causalidad ni magnitud del daño.&lt;/td&gt;&lt;td&gt;Vincular consecuencias a evidencia clínica directa; usar currículo sólo como exigencia competencial.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;La estadística agregada borra eventos singulares.&lt;/td&gt;&lt;td&gt;Desaparición de casos raros, subgrupos y fallos de alta gravedad.&lt;/td&gt;&lt;td&gt;Conservar filas individuales, auditar subgrupos y revisar adversarialmente outliers/casos centinela.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Etiquetas expertas se tratan como verdad absoluta.&lt;/td&gt;&lt;td&gt;Incorpora desacuerdo, sesgo local y circularidad en el estándar de referencia.&lt;/td&gt;&lt;td&gt;Protocolo de adjudicación, desacuerdo visible y U cuando no exista cierre legítimo.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Validación retrospectiva se presenta como autorización asistencial.&lt;/td&gt;&lt;td&gt;Daño por traslado prematuro a pacientes reales.&lt;/td&gt;&lt;td&gt;Separar validez retrospectiva, externa, prospectiva y autorización de uso clínico.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-process&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-process&quot; hidden&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Adversarial de ingeniería de procesos&lt;/h2&gt;
          &lt;p&gt;Gobierna secuencia, versiones, interfaces y pruebas. No decide qué conocimiento inmunológico es correcto.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-verdict&quot; data-hard-stop=&quot;true&quot;&gt;
          &lt;strong&gt;Veredicto: la gobernabilidad exige invertir el orden y separar cuatro objetos.&lt;/strong&gt;
          &lt;p&gt;Datos clínicos, representación ternaria, núcleo determinista y evaluación estadística deben tener identidades y versiones distintas. Mezclarlos impediría saber qué produjo cada resultado.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-table-wrap&quot;&gt;
          &lt;table aria-label=&quot;Hallazgos adversariales de proceso&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Nivel&lt;/th&gt;&lt;th&gt;Fallo de proceso&lt;/th&gt;&lt;th&gt;Efecto&lt;/th&gt;&lt;th&gt;Control exigido&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Confundir (n,b) con una matriz b × b.&lt;/td&gt;&lt;td&gt;Destruye dimensionalidad, cardinalidad y significado de los componentes.&lt;/td&gt;&lt;td&gt;Modelo de tipos y nomenclatura formal antes de programar o publicar.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Congelar requisitos antes de demostrar datos disponibles.&lt;/td&gt;&lt;td&gt;Arquitectura no verificable o forzada a fuentes inadecuadas.&lt;/td&gt;&lt;td&gt;Puerta D0 de factibilidad de datos.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Usar las semillas como plantilla rígida del catálogo.&lt;/td&gt;&lt;td&gt;Sesgo de arquitectura y exclusión de variables o módulos necesarios.&lt;/td&gt;&lt;td&gt;Usarlas sólo como pruebas de proceso; derivar la arquitectura al final del inventario.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Composición sin tipos, dirección o versión.&lt;/td&gt;&lt;td&gt;El mismo conjunto produce consecuencias diferentes sin que el cambio sea visible.&lt;/td&gt;&lt;td&gt;Grafo dirigido tipado, contratos de puente y pruebas de orden.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Reloj del sistema o aleatoriedad implícitos.&lt;/td&gt;&lt;td&gt;Dos ejecuciones iguales pueden divergir sin explicación.&lt;/td&gt;&lt;td&gt;Tiempo como dato explícito; prohibición de reloj oculto, RNG y aprendizaje autónomo en el núcleo.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Resultado estadístico sin procedencia atraviesa la frontera.&lt;/td&gt;&lt;td&gt;Una estimación poblacional se convierte en hecho del paciente.&lt;/td&gt;&lt;td&gt;Tipo externo con población, método, fecha, incertidumbre y regla de uso autorizada.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Actualizar reglas o conocimiento sin control de cambios.&lt;/td&gt;&lt;td&gt;Incomparabilidad de resultados y pérdida de causalidad.&lt;/td&gt;&lt;td&gt;Versionar corpus, datos, diccionario, reglas, código, umbrales y salidas.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-major&quot;&gt;Mayor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Corregir sobrescribiendo.&lt;/td&gt;&lt;td&gt;Se pierde la historia clínica-operativa del cierre y reapertura.&lt;/td&gt;&lt;td&gt;Append-only con eventos de corrección, nunca borrado del suceso previo.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;ig-level ig-blocking&quot;&gt;Bloqueante&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Abrir R2 por madurez informática sin cierre biomédico.&lt;/td&gt;&lt;td&gt;El Lenguaje consolida prematuramente errores del dominio.&lt;/td&gt;&lt;td&gt;Puerta final conjunta: clínica + datos + lógica + revisión + autorización humana.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-source-grid&quot; style=&quot;margin-top:14px&quot;&gt;
          &lt;article class=&quot;ig-block&quot;&gt;
            &lt;h3&gt;Matriz de trazabilidad mínima&lt;/h3&gt;
            &lt;p&gt;Necesidad clínica → conocimiento → variable → campo de datos → admisibilidad → transducción → consecuencia → módulo → prueba → salida visible.&lt;/p&gt;
          &lt;/article&gt;
          &lt;article class=&quot;ig-block ig-clinical-block&quot;&gt;
            &lt;h3&gt;Separación de responsabilidades&lt;/h3&gt;
            &lt;p&gt;El experto clínico cierra conocimiento y consecuencias; datos valida fuente y calidad; ingeniería garantiza proceso; estadística evalúa fuera del núcleo; la IA auxilia sin autoridad.&lt;/p&gt;
          &lt;/article&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-logic&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-logic&quot; hidden&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Adversarial lógica enlazada&lt;/h2&gt;
          &lt;p&gt;Impide que un acierto clínico se implemente con una forma matemática falsa, o que una forma correcta adquiera una interpretación clínica que no posee.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-verdict&quot; data-hard-stop=&quot;true&quot;&gt;
          &lt;strong&gt;Veredicto: deben distinguirse instancia, matriz de datos y espacio de estados.&lt;/strong&gt;
          &lt;p&gt;Una representación (9,3) no es una matriz 3 × 3; una (25,5) no es 5 × 5. El segundo término b satisface n = b², pero no es número de filas. Confundirlos altera toda la base combinatoria.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-math-grid&quot;&gt;
          &lt;article class=&quot;ig-block&quot;&gt;
            &lt;h3&gt;1 · Matriz clínica&lt;/h3&gt;
            &lt;p&gt;Objeto que reúne casos y variables.&lt;/p&gt;
            &lt;div class=&quot;ig-formula&quot;&gt;X = (a&lt;sub&gt;ij&lt;/sub&gt;) ∈ D&lt;sup&gt;N×p&lt;/sup&gt;&lt;br&gt;a&lt;sub&gt;ij&lt;/sub&gt; = dato del caso i, variable j&lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;ig-block ig-boundary-block&quot;&gt;
            &lt;h3&gt;2 · Instancia ternaria&lt;/h3&gt;
            &lt;p&gt;Un caso admitido se representa por un único vector ordenado.&lt;/p&gt;
            &lt;div class=&quot;ig-formula&quot;&gt;s&lt;sub&gt;i&lt;/sub&gt; = (s&lt;sub&gt;i1&lt;/sub&gt;, …, s&lt;sub&gt;in&lt;/sub&gt;) ∈ Σ&lt;sup&gt;n&lt;/sup&gt;&lt;br&gt;Σ = {0,1,U}&lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;ig-block ig-clinical-block&quot;&gt;
            &lt;h3&gt;3 · Espacio de estados&lt;/h3&gt;
            &lt;p&gt;Conjunto de todos los vectores posibles de longitud n.&lt;/p&gt;
            &lt;div class=&quot;ig-formula&quot;&gt;S&lt;sub&gt;n&lt;/sub&gt; = Σ&lt;sup&gt;n&lt;/sup&gt;&lt;br&gt;|S&lt;sub&gt;n&lt;/sub&gt;| = 3&lt;sup&gt;n&lt;/sup&gt;&lt;/div&gt;
          &lt;/article&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-cardinality&quot;&gt;
          &lt;div class=&quot;ig-number&quot;&gt;&lt;strong&gt;n=9, b=3 → 3⁹ = 19.683&lt;/strong&gt;&lt;span&gt;Una instancia es un vector fila 1 × 9; el espacio contiene 19.683 vectores posibles. No es una matriz 3 × 3.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-number&quot;&gt;&lt;strong&gt;n=25, b=5 → 3²⁵ = 847.288.609.443&lt;/strong&gt;&lt;span&gt;Una instancia es un vector fila 1 × 25; el espacio contiene 847.288.609.443 vectores posibles. No es una matriz 5 × 5.&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-pipeline&quot; aria-label=&quot;Cadena de tipos enlazada&quot;&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;R&lt;/strong&gt;&lt;span&gt;Registro clínico real, con hechos, ausencias y tiempos.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;X=(a&lt;sub&gt;ij&lt;/sub&gt;)&lt;/strong&gt;&lt;span&gt;Matriz de datos; filas casos, columnas variables.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;A&lt;/strong&gt;&lt;span&gt;Admisibilidad: fuente, calidad, unidad y contexto.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;τ&lt;/strong&gt;&lt;span&gt;Transducción clínica explícita y versionada.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;s∈Σ&lt;sup&gt;n&lt;/sup&gt;&lt;/strong&gt;&lt;span&gt;Vector ternario de una instantánea admitida.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;F&lt;/strong&gt;&lt;span&gt;Resolución determinista con regla fija.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ig-pipe-step&quot;&gt;&lt;strong&gt;y + traza&lt;/strong&gt;&lt;span&gt;Salida, justificación, residual y eventos.&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-external-eval&quot;&gt;
          &lt;strong&gt;Evaluación estadística y temporal: por fuera de F&lt;/strong&gt;
          &lt;span&gt;V(y, desenlaces) puede usar métodos clínicos, estadísticos y temporales para medir validez. Sus resultados no se convierten retroactivamente en una primitiva oculta del núcleo.&lt;/span&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-table-wrap&quot; style=&quot;margin-top:14px&quot;&gt;
          &lt;table aria-label=&quot;Errores lógicos y correcciones&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Error de categoría&lt;/th&gt;&lt;th&gt;Corrección&lt;/th&gt;&lt;th&gt;Razón&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;“El nulo del repositorio es U.”&lt;/td&gt;&lt;td&gt;El nulo pertenece a la capa de datos; una regla puede transducir una insuficiencia a U.&lt;/td&gt;&lt;td&gt;U es estado epistémico constituido, no valor técnico de ausencia.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;“Una probabilidad externa es el estado del paciente.”&lt;/td&gt;&lt;td&gt;Es evidencia externa tipada; requiere población, método, incertidumbre y regla de uso.&lt;/td&gt;&lt;td&gt;Una estimación poblacional no es un hecho singular.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;“Determinista significa clínicamente cierto.”&lt;/td&gt;&lt;td&gt;Significa misma entrada admitida + misma regla = misma salida.&lt;/td&gt;&lt;td&gt;La reproducibilidad formal no elimina incertidumbre biológica.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;“El promedio representa a todos.”&lt;/td&gt;&lt;td&gt;El agregado se conserva junto a cada fila individual y sus subgrupos.&lt;/td&gt;&lt;td&gt;Los eventos raros o extremos pueden tener máxima consecuencia clínica.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;“Mismos módulos implica mismo resultado.”&lt;/td&gt;&lt;td&gt;Se documentan dirección, puente, precedencia y operador.&lt;/td&gt;&lt;td&gt;La composición puede ser asimétrica y el orden puede alterar la advertencia.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-boundary&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-boundary&quot; hidden&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Datos reales y frontera de no contaminación&lt;/h2&gt;
          &lt;p&gt;La medicina puede usar tiempo y estadística con toda legitimidad. La frontera impide que esas herramientas se conviertan en primitivas ocultas del núcleo determinista.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-boundary-grid&quot;&gt;
          &lt;article class=&quot;ig-block ig-clinical-block&quot;&gt;
            &lt;h3&gt;Exterior clínico legítimo&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;Registros, cohortes, ensayos, guías y consensos.&lt;/li&gt;
              &lt;li&gt;Tiempo de seguimiento, fechas, supervivencia y secuencias clínicas.&lt;/li&gt;
              &lt;li&gt;Estadística descriptiva/inferencial, incertidumbre y validación.&lt;/li&gt;
              &lt;li&gt;Casos singulares y datos fila a fila, no sólo agregados.&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/article&gt;

          &lt;div class=&quot;ig-boundary-arrow&quot; aria-label=&quot;Contrato de frontera&quot;&gt;
            &lt;span aria-hidden=&quot;true&quot;&gt;⇄&lt;/span&gt;
            &lt;span&gt;Contrato tipado y versionado&lt;/span&gt;
            &lt;span aria-hidden=&quot;true&quot;&gt;⇄&lt;/span&gt;
          &lt;/div&gt;

          &lt;article class=&quot;ig-block&quot;&gt;
            &lt;h3&gt;Núcleo determinista&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;Entrada admitida y explícita.&lt;/li&gt;
              &lt;li&gt;Regla fija, versionada y auditable.&lt;/li&gt;
              &lt;li&gt;Sin reloj oculto, RNG, inferencia opaca o aprendizaje autónomo.&lt;/li&gt;
              &lt;li&gt;Salida ternaria, residual, justificación y traza.&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/article&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-source-grid&quot; style=&quot;margin-top:12px&quot;&gt;
          &lt;article class=&quot;ig-block ig-boundary-block&quot;&gt;
            &lt;h3&gt;Puede atravesar la frontera&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;Marca temporal como dato explícito del episodio.&lt;/li&gt;
              &lt;li&gt;Estimación externa con fuente, población, método, fecha e incertidumbre.&lt;/li&gt;
              &lt;li&gt;Medición con unidad, instrumento, calidad y procedencia.&lt;/li&gt;
              &lt;li&gt;Umbral clínico autorizado mediante regla de transducción versionada.&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/article&gt;
          &lt;article class=&quot;ig-block ig-danger-block&quot; data-hard-stop=&quot;true&quot;&gt;
            &lt;h3&gt;No puede atravesarla sin transformación autorizada&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;&lt;code&gt;now()&lt;/code&gt; o dependencia temporal implícita.&lt;/li&gt;
              &lt;li&gt;Probabilidad convertida silenciosamente en certeza.&lt;/li&gt;
              &lt;li&gt;Promedio que sustituye las observaciones singulares.&lt;/li&gt;
              &lt;li&gt;&lt;code&gt;null&lt;/code&gt;/&lt;code&gt;NA&lt;/code&gt; coercionado automáticamente a U.&lt;/li&gt;
              &lt;li&gt;Puntuación latente sin semántica clínica y procedencia.&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/article&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-panel-title&quot; style=&quot;margin-top:20px&quot;&gt;
          &lt;h2&gt;Protocolo de búsqueda de repositorios&lt;/h2&gt;
          &lt;p&gt;Esta versión fija cómo buscar; no selecciona aún ninguna fuente concreta.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-table-wrap&quot;&gt;
          &lt;table aria-label=&quot;Campos para auditar repositorios clínicos&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dimensión&lt;/th&gt;&lt;th&gt;Debe documentarse&lt;/th&gt;&lt;th&gt;Parada si falta&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Gobierno&lt;/td&gt;&lt;td&gt;Custodio, licencia, acceso, ética, anonimización y posibilidad de reutilización.&lt;/td&gt;&lt;td&gt;No hay acceso legal o trazable.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Población&lt;/td&gt;&lt;td&gt;País, centros, criterios de inclusión/exclusión, edad, enfermedad, tratamientos y periodo.&lt;/td&gt;&lt;td&gt;No coincide con la intención de uso.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Unidad&lt;/td&gt;&lt;td&gt;Paciente, episodio, consulta, muestra o intervención; identificadores y duplicados.&lt;/td&gt;&lt;td&gt;No puede reconstruirse la unidad de análisis.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Variables&lt;/td&gt;&lt;td&gt;Diccionario, unidades, codificación, rangos, cambios históricos y procedencia.&lt;/td&gt;&lt;td&gt;No puede mapearse a criterios clínicos.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Tiempo&lt;/td&gt;&lt;td&gt;Fechas, orden de eventos, ventanas, censura y actualización.&lt;/td&gt;&lt;td&gt;Existe fuga temporal o no puede establecerse precedencia.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Desenlaces&lt;/td&gt;&lt;td&gt;Definición, adjudicación, disponibilidad y horizonte clínico.&lt;/td&gt;&lt;td&gt;No hay estándar de referencia medible.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Calidad&lt;/td&gt;&lt;td&gt;Ausencias, ruido, sesgo de selección, cambios de práctica y pérdidas de seguimiento.&lt;/td&gt;&lt;td&gt;La calidad impide una transducción defendible.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Validación&lt;/td&gt;&lt;td&gt;Posibilidad de separación construcción/prueba y de cohorte externa, temporal o multicéntrica.&lt;/td&gt;&lt;td&gt;Sólo existe el mismo conjunto usado para diseñar.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Singulares&lt;/td&gt;&lt;td&gt;Acceso a filas, subgrupos, outliers y eventos raros de alta consecuencia.&lt;/td&gt;&lt;td&gt;El repositorio sólo ofrece agregados irreversibles.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ig-panel&quot; id=&quot;ig-panel-review&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ig-tab-review&quot; hidden&gt;
        &lt;div class=&quot;ig-panel-title&quot;&gt;
          &lt;h2&gt;Lista de cierre para revisión por pares hostil&lt;/h2&gt;
          &lt;p&gt;Las marcas se guardan únicamente en este navegador. Un ítem marcado significa “respondido dentro del manuscrito”, no “considerado informalmente”.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-review-progress&quot;&gt;
          &lt;div class=&quot;ig-progress-track&quot; role=&quot;progressbar&quot; aria-label=&quot;Preguntas respondidas&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;20&quot; aria-valuenow=&quot;0&quot;&gt;&lt;div class=&quot;ig-progress-bar&quot; id=&quot;ig-progress-bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;span class=&quot;ig-review-count&quot; id=&quot;ig-review-count&quot; aria-live=&quot;polite&quot;&gt;0 de 20 respondidas&lt;/span&gt;
          &lt;button class=&quot;ig-action&quot; id=&quot;ig-reset-checks&quot; type=&quot;button&quot;&gt;Reiniciar&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-checklist&quot;&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;1 · Pregunta clínica&lt;/strong&gt;&lt;span&gt;¿Está definida en una frase verificable, con decisión asistida e intención de uso?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;2 · Población y escenario&lt;/strong&gt;&lt;span&gt;¿Se fijan población, centro, profesional, momento y exclusiones?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;3 · Consecuencias&lt;/strong&gt;&lt;span&gt;¿Cada omisión relevante se vincula por separado al paciente y al experto?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;4 · Gravedad y probabilidad&lt;/strong&gt;&lt;span&gt;¿No se confunden consecuencia potencial, frecuencia, riesgo y acción?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;5 · Datos antes de modelo&lt;/strong&gt;&lt;span&gt;¿La factibilidad de repositorios precedió a la congelación de parámetros?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;6 · Unidad de análisis&lt;/strong&gt;&lt;span&gt;¿Está claro qué representa cada fila y cada columna a&lt;sub&gt;ij&lt;/sub&gt;?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;7 · Semillas&lt;/strong&gt;&lt;span&gt;¿IMMUNO-1/2 se presentan sin insinuar exhaustividad del dominio?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;8 · Dimensionalidad&lt;/strong&gt;&lt;span&gt;¿Se distingue vector 1×n, parámetro b y espacio de 3&lt;sup&gt;n&lt;/sup&gt; estados?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;9 · Admisibilidad&lt;/strong&gt;&lt;span&gt;¿Se documentan fuente, calidad, unidad y contexto antes de transducir?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;10 · U&lt;/strong&gt;&lt;span&gt;¿No se equipara U con nulo, ausencia, probabilidad o comodidad?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;11 · Dominio y residual&lt;/strong&gt;&lt;span&gt;¿Se declara qué cubre, qué no cubre y qué queda abierto?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;12 · Composición&lt;/strong&gt;&lt;span&gt;¿Puentes, tipos, dirección, orden y consecuencias están probados?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;13 · Frontera estadística&lt;/strong&gt;&lt;span&gt;¿Toda estimación externa conserva población, método e incertidumbre?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;14 · Frontera temporal&lt;/strong&gt;&lt;span&gt;¿Todo tiempo es dato explícito y no reloj/primitiva oculta?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;15 · Casos singulares&lt;/strong&gt;&lt;span&gt;¿Se conservan filas, subgrupos, outliers y eventos raros?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;16 · Comparador y desenlace&lt;/strong&gt;&lt;span&gt;¿Estándar de referencia, endpoints y métricas se preespecifican?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;17 · Validación separada&lt;/strong&gt;&lt;span&gt;¿Construcción y prueba están separadas, con evaluación externa adecuada?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;18 · Humano soberano&lt;/strong&gt;&lt;span&gt;¿La IA no actualiza conocimiento ni adopta cierre clínico sin protocolo?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;19 · Autocontención&lt;/strong&gt;&lt;span&gt;¿El artículo se entiende sin conocer el nombre SV ni otros textos internos?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
          &lt;label class=&quot;ig-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-review-check&gt;&lt;span&gt;&lt;strong&gt;20 · Reproducibilidad&lt;/strong&gt;&lt;span&gt;¿Datos, diccionario, reglas, código, versiones y eventos permiten repetir?&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;/div&gt;

        &lt;div class=&quot;ig-gate ig-hard-stop&quot; data-hard-stop=&quot;true&quot; style=&quot;margin-top:14px&quot;&gt;
          &lt;strong&gt;Regla de cierre&lt;/strong&gt;
          &lt;p&gt;Una casilla pendiente no se compensa con prosa adicional ni con prestigio bibliográfico. Se responde, se declara como limitación o se mantiene el proyecto detenido.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;

    &lt;footer class=&quot;ig-references&quot;&gt;
      &lt;h3&gt;Perímetro bibliográfico formal de este documento de gobierno&lt;/h3&gt;
      &lt;ol&gt;
        &lt;li&gt;Lloret Egea, Juan Antonio. &lt;em&gt;Fundamentos algebraico-semánticos del Sistema Vectorial SV&lt;/em&gt;, versión canónica suministrada.&lt;/li&gt;
        &lt;li&gt;Lloret Egea, Juan Antonio. &lt;em&gt;Origen doctrinal, definición y alcance de la U en el Sistema Vectorial SV&lt;/em&gt;, versión canónica suministrada.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p&gt;La publicación biomédica futura deberá añadir exclusivamente bibliografía clínica directamente pertinente al subdominio, las variables, las consecuencias, los estándares y los conjuntos de datos seleccionados. No se incorpora aquí ninguna fuente clínica concreta porque su búsqueda efectiva aún no ha sido autorizada.&lt;/p&gt;
      &lt;p class=&quot;ig-note&quot;&gt;El PDF de Álgebra de composición intercelular se ha usado como perímetro contextual de proceso, no como apoyo bibliográfico adicional. La nomenclatura principal del manuscrito será la de vectores, arrays y matrices; la denominación interna “célula” sólo podrá aparecer entre paréntesis cuando sea necesaria para la concordancia técnica.&lt;/p&gt;
    &lt;/footer&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;immunology-domain-governance-v2&#x27;);
      if (!root) return;

      const tabs = Array.from(root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[role=&quot;tabpanel&quot;]&#x27;));

      function activateTab(tab) {
        tabs.forEach((candidate) =&gt; candidate.setAttribute(&#x27;aria-selected&#x27;, String(candidate === tab)));
        panels.forEach((panel) =&gt; { panel.hidden = panel.id !== tab.getAttribute(&#x27;aria-controls&#x27;); });
        try { sessionStorage.setItem(&#x27;ig-active-tab&#x27;, tab.id); } catch (_) {}
      }

      tabs.forEach((tab, index) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; activateTab(tab));
        tab.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
          if (![&#x27;ArrowRight&#x27;, &#x27;ArrowLeft&#x27;, &#x27;Home&#x27;, &#x27;End&#x27;].includes(event.key)) return;
          event.preventDefault();
          let next = index;
          if (event.key === &#x27;ArrowRight&#x27;) next = (index + 1) % tabs.length;
          if (event.key === &#x27;ArrowLeft&#x27;) next = (index - 1 + tabs.length) % tabs.length;
          if (event.key === &#x27;Home&#x27;) next = 0;
          if (event.key === &#x27;End&#x27;) next = tabs.length - 1;
          tabs[next].focus();
          activateTab(tabs[next]);
        });
      });

      try {
        const savedTab = sessionStorage.getItem(&#x27;ig-active-tab&#x27;);
        const target = savedTab &amp;&amp; root.querySelector(&#x27;#&#x27; + CSS.escape(savedTab));
        if (target) activateTab(target);
      } catch (_) {}

      const reviewMode = root.querySelector(&#x27;#ig-review-mode&#x27;);
      reviewMode.addEventListener(&#x27;click&#x27;, () =&gt; {
        const active = root.classList.toggle(&#x27;ig-review-mode&#x27;);
        reviewMode.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        reviewMode.textContent = active ? &#x27;Quitar resaltado&#x27; : &#x27;Resaltar bloqueos&#x27;;
      });

      root.querySelector(&#x27;#ig-print&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; window.print());

      const checks = Array.from(root.querySelectorAll(&#x27;[data-review-check]&#x27;));
      const progressBar = root.querySelector(&#x27;#ig-progress-bar&#x27;);
      const progressTrack = progressBar.parentElement;
      const progressCount = root.querySelector(&#x27;#ig-review-count&#x27;);

      function updateReview() {
        const done = checks.filter((check) =&gt; check.checked).length;
        const percentage = checks.length ? (done / checks.length) * 100 : 0;
        progressBar.style.width = percentage + &#x27;%&#x27;;
        progressTrack.setAttribute(&#x27;aria-valuenow&#x27;, String(done));
        progressTrack.setAttribute(&#x27;aria-valuemax&#x27;, String(checks.length));
        progressCount.textContent = done + &#x27; de &#x27; + checks.length + &#x27; respondidas&#x27;;
        try {
          localStorage.setItem(&#x27;ig-review-v2&#x27;, JSON.stringify(checks.map((check) =&gt; check.checked)));
        } catch (_) {}
      }

      try {
        const saved = JSON.parse(localStorage.getItem(&#x27;ig-review-v2&#x27;) || &#x27;[]&#x27;);
        checks.forEach((check, index) =&gt; { check.checked = Boolean(saved[index]); });
      } catch (_) {}

      checks.forEach((check) =&gt; check.addEventListener(&#x27;change&#x27;, updateReview));
      root.querySelector(&#x27;#ig-reset-checks&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        checks.forEach((check) =&gt; { check.checked = false; });
        updateReview();
      });
      updateReview();
    })();
  &lt;/script&gt;
